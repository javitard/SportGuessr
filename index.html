<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <!-- The version placeholders below are replaced with the commit id on deploy (.github/workflows/pages.yml) -->
  <meta name="app-version" content="__VERSION__">
  <title>Matchpin — the daily sports geography game</title>
  <meta name="description" content="Five legendary sporting moments a day. Drop a pin where they happened — the closer you are, the more you score.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Matchpin">
  <meta property="og:locale" content="en_GB">
  <meta property="og:locale:alternate" content="es_ES">
  <meta property="og:title" content="Matchpin — Where did it happen?">
  <meta property="og:description" content="Five legendary sporting moments a day. Drop a pin where they happened. How close can you get?">
  <meta property="og:url" content="https://javitard.github.io/SportGuessr/">
  <meta property="og:image" content="https://javitard.github.io/SportGuessr/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Matchpin: Where did it happen? Pins and a route on a dark map of Europe">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Matchpin — Where did it happen?">
  <meta name="twitter:description" content="Five legendary sporting moments a day. Drop a pin where they happened. How close can you get?">
  <meta name="twitter:image" content="https://javitard.github.io/SportGuessr/og-image.png">
  <meta name="theme-color" content="#07090c">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="vendor/fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="vendor/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css?v=__VERSION__">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css?v=__VERSION__">
  <link rel="stylesheet" href="css/style.css?v=__VERSION__">
</head>
<body class="is-intro">
  <header class="topbar">
    <a class="brand" href="./" aria-label="Matchpin">
      <svg class="brand-mark" viewBox="0 0 48 64" aria-hidden="true"><path d="M24 2C12 2 3 11.2 3 23c0 15.5 21 39 21 39s21-23.5 21-39C45 11.2 36 2 24 2z" fill="currentColor"/><circle cx="24" cy="23" r="11.5" fill="#07090c"/><circle cx="24" cy="23" r="5" fill="currentColor"/></svg>
      <span class="brand-word">Match<b>pin</b></span>
    </a>
    <nav class="topbar-actions">
      <button class="ghost-btn lang-btn" id="btn-lang" data-i18n-aria="language">ES</button>
      <button class="ghost-btn" id="btn-help" data-i18n-aria="help">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.6"/><circle cx="12" cy="17.2" r=".4" fill="currentColor"/></svg>
      </button>
      <button class="ghost-btn" id="btn-stats" data-i18n-aria="stats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
      </button>
    </nav>
  </header>

  <div id="map" aria-label="Map"></div>

  <!-- Start screen -->
  <section class="intro" id="intro">
    <div class="intro-inner">
      <p class="eyebrow"><span class="live-dot"></span><span id="intro-eyebrow"></span></p>
      <h1 class="hero" data-i18n-html="heroTitle"></h1>
      <p class="lede" data-i18n="heroLede"></p>
      <ol class="lineup" id="lineup"></ol>
      <button class="cta" id="btn-start"><span id="start-label"></span><kbd>↵</kbd></button>
      <p class="intro-meta" id="intro-meta"></p>
    </div>
  </section>

  <!-- Question / answer card -->
  <section class="panel" id="panel" aria-live="polite">
    <div class="progress" id="progress"></div>
    <div class="panel-head">
      <div class="tags">
        <span class="tag" id="sport-tag"></span>
        <span class="tag level" id="level"></span>
        <span class="tag mult" id="mult-tag"></span>
        <span class="tag practice" id="practice-tag" hidden></span>
      </div>
      <div class="round" id="round"></div>
    </div>

    <div id="ask">
      <p class="question" id="question"></p>
      <button class="btn primary" id="btn-confirm" disabled></button>
    </div>

    <div id="reveal" hidden>
      <div class="reveal-top">
        <div>
          <p class="verdict-label" id="tier-label"></p>
          <p class="answer" id="answer"></p>
        </div>
        <div class="reveal-points">
          <span class="num" id="points">0</span>
          <small id="points-max"></small>
        </div>
      </div>
      <div class="meter"><div class="meter-fill" id="meter-fill"></div></div>
      <div class="reveal-meta">
        <span id="distance"></span>
        <span><span data-i18n="total"></span> <b class="num" id="score">0</b></span>
      </div>
      <p class="fact" id="fact"></p>
      <button class="btn primary" id="btn-next"></button>
    </div>
  </section>

  <!-- How to play -->
  <dialog class="modal" id="modal-help">
    <button class="close" data-close data-i18n-aria="close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <p class="modal-kicker">Matchpin</p>
    <h2 data-i18n="howTitle"></h2>
    <ol class="steps">
      <li><span class="step-n">01</span><p data-i18n-html="how1"></p></li>
      <li><span class="step-n">02</span><p data-i18n-html="how2"></p></li>
      <li><span class="step-n">03</span><p data-i18n-html="how3"></p></li>
    </ol>
    <div class="legend">
      <span><i class="sq t4"></i>&lt; 50 km</span>
      <span><i class="sq t3"></i>&lt; 250 km</span>
      <span><i class="sq t2"></i>&lt; 700 km</span>
      <span><i class="sq t1"></i><span data-i18n="further"></span></span>
    </div>
    <button class="btn primary" data-close data-i18n="gotIt"></button>
  </dialog>

  <!-- Profile -->
  <dialog class="modal profile" id="modal-stats">
    <button class="close" data-close data-i18n-aria="close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <p class="modal-kicker">Matchpin</p>
    <h2 data-i18n="statsTitle"></h2>
    <div class="stat-grid" id="stat-grid"></div>
    <p class="muted" id="profile-empty" data-i18n="emptyProfile"></p>
    <div id="profile-data" hidden>
      <div class="highlights" id="highlights"></div>
      <h3><span data-i18n="achievementsTitle"></span> <span class="h3-count" id="achievements-count"></span></h3>
      <div class="badges" id="achievements"></div>
      <h3 data-i18n="bySport"></h3>
      <div class="meter-list" id="by-sport"></div>
      <details class="more" id="by-sport-more-wrap">
        <summary id="by-sport-more-label"></summary>
        <div class="meter-list" id="by-sport-more"></div>
      </details>
      <h3 data-i18n="byLevel"></h3>
      <div class="meter-list" id="by-level"></div>
      <h3 data-i18n="pinsTitle"></h3>
      <div class="profile-map" id="profile-map" role="img" data-i18n-aria="pinsTitle"></div>
    </div>
    <h3 data-i18n="distTitle"></h3>
    <div class="dist" id="dist"></div>
  </dialog>

  <!-- End of game -->
  <dialog class="modal results" id="modal-results">
    <button class="close" data-close data-i18n-aria="close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <p class="modal-kicker" id="results-kicker"></p>
    <div class="final">
      <span class="final-score num" id="final-score">0</span>
      <span class="final-max num" id="final-max"></span>
    </div>
    <p class="final-verdict" id="verdict"></p>
    <div class="tiers" id="tiers"></div>
    <ol class="recap" id="recap"></ol>
    <button class="btn primary big" id="btn-share">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
      <span id="share-label" data-i18n="share"></span>
    </button>
    <div class="results-foot">
      <div>
        <small data-i18n="nextPuzzle"></small>
        <div class="countdown num" id="countdown">--:--:--</div>
      </div>
      <div class="foot-actions">
        <button class="btn ghost small" id="btn-map" data-i18n="seeMap"></button>
        <button class="btn ghost small" id="btn-practice" data-i18n="practiceRound"></button>
      </div>
    </div>
  </dialog>

  <button class="btn primary floating" id="btn-show-results" data-i18n="showResults" hidden></button>

  <script src="vendor/leaflet/leaflet.js?v=__VERSION__"></script>
  <script src="vendor/topojson/topojson-client.min.js?v=__VERSION__"></script>
  <script src="vendor/world/countries-50m.js?v=__VERSION__"></script>
  <script src="js/i18n.js?v=__VERSION__"></script>
  <script src="js/tags.js?v=__VERSION__"></script>
  <script src="js/scoring.js?v=__VERSION__"></script>
  <script src="js/profile.js?v=__VERSION__"></script>
  <script src="js/questions.js?v=__VERSION__"></script>
  <script src="js/game.js?v=__VERSION__"></script>
</body>
</html>
